<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Ludo</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/premium.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="brand">MORGANENTP</h1>
      <nav class="nav-actions">
        <button id="lobbyBtn" class="btn ghost">Lobby</button>
        <button id="profileBtn" class="btn ghost">Profile</button>
      </nav>
    </header>

    <main id="main" class="main hidden">
      <section class="board-wrap" id="boardWrap"></section>
      <section class="sidebar">
        <div class="panel">
          <h3>Status</h3>
          <div id="statusLine">Set up a game to start</div>
        </div>
        <div class="panel">
          <h3>Turn</h3>
          <div class="turn-banner" id="turnBanner">—</div>
        </div>
        <div class="panel">
          <h3>Rank</h3>
          <ol class="rank-list" id="rankList"></ol>
        </div>
      </section>
    </main>

    <section id="lobby" class="lobby">
      <div class="panel setup">
        <h2>New Game</h2>
        <label>
          Players
          <select id="playerCount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
          </select>
        </label>
        <label>
          Mode
          <select id="mode">
            <option value="bot">Vs Bots</option>
            <option value="local">Local Pass &amp; Play</option>
          </select>
        </label>
        <div id="slots" class="slots"></div>
        <button id="startBtn" class="btn primary">Start Game</button>
      </div>
    </section>
  </div>

  <script src="js/models/Player.js"></script>
  <script src="js/models/Token.js"></script>
  <script src="js/models/Dice.js"></script>
  <script src="js/boards/PathGenerator.js"></script>
  <script src="js/boards/BoardManager.js"></script>
  <script src="js/core/GameEngine.js"></script>
  <script src="js/core/MovementEngine.js"></script>
  <script src="js/core/CaptureEngine.js"></script>
  <script src="js/core/VictoryEngine.js"></script>
  <script src="js/core/SaveManager.js"></script>
  <script src="js/core/Statistics.js"></script>
  <script src="js/core/Tournament.js"></script>
  <script src="js/core/Achievements.js"></script>
  <script src="js/ai/BaseAI.js"></script>
  <script src="js/ai/EasyBot.js"></script>
  <script src="js/ai/MediumBot.js"></script>
  <script src="js/ai/ExpertBot.js"></script>
  <script src="js/ai/AIManager.js"></script>
  <script src="js/premium/BattlePass.js"></script>
  <script src="js/premium/DailyMissions.js"></script>
  <script src="js/premium/XPSystem.js"></script>
  <script src="js/premium/Store.js"></script>
  <script src="js/effects/Fireworks.js"></script>
  <script src="js/effects/Particles.js"></script>
  <script src="js/effects/DiceAnimation.js"></script>
  <script src="js/effects/ThreeDDice.js"></script>
  <script src="js/effects/MorganOrbit.js"></script>
  <script src="js/effects/orbit.lifecycle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
